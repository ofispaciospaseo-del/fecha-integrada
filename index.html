<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechador Digital de Fe Cierta - Estampa Unificada</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0284c7;
      --text-color: #f8fafc;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.3rem;
      color: #38bdf8;
    }

    /* Línea de tiempo en vivo */
    .timeline-bar {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-family: monospace;
      margin-bottom: 16px;
    }

    .clock-live {
      font-size: 1.2rem;
      font-weight: bold;
      color: #22c55e;
      word-break: break-all;
    }

    .upload-zone {
      border: 2px dashed #0284c7;
      border-radius: 8px;
      padding: 24px 12px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
      background: #111827;
    }

    .upload-zone p {
      margin: 0;
      font-weight: 600;
      color: #38bdf8;
    }

    input[type="file"] {
      display: none;
    }

    #hiddenCanvas {
      display: none;
    }

    .result-section {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .result-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .download-link {
      display: block;
      width: 100%;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 16px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.4);
    }

    .download-link:active {
      background: #15803d;
    }

    .hint-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Fechador Digital de Fe Cierta</h1>

  <!-- Reloj / Línea de tiempo continua -->
  <div class="timeline-bar">
    <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">LÍNEA DE TIEMPO EN VIVO (UTC)</div>
    <div class="clock-live" id="liveClock">0000-00-00 00:00:00.000</div>
  </div>

  <!-- Zona de carga -->
  <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
    <p>📷 TOCAR AQUÍ PARA SUBIR O TOMAR FOTO</p>
    <input type="file" id="imgInput" accept="image/*" onchange="handleFileSelect(this.files[0])">
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <!-- Resultado con estampa unificada -->
  <div class="result-section" id="resultSection">
    <p style="text-align: left; margin-bottom: 8px; font-weight: bold; color: #cbd5e1;">Imagen Estampada Unificada:</p>
    <img id="finalImage" class="result-img" alt="Imagen estampada">
    
    <a id="downloadBtn" class="download-link" href="#" download="fechado_integrado.png">📥 DESCARGAR IMAGEN ESTAMPADA</a>
    <p class="hint-text">(También puedes mantener presionada la imagen en celulares para guardarla)</p>
  </div>
</div>

<script>
  // Reloj continuo con milisegundos
  function updateLiveClock() {
    const now = new Date();
    const isoString = now.toISOString().replace('T', ' ').replace('Z', '');
    document.getElementById('liveClock').textContent = isoString;
    requestAnimationFrame(updateLiveClock);
  }
  requestAnimationFrame(updateLiveClock);

  function handleFileSelect(file) {
    if (!file) return;

    const timestamp = new Date();
    const formattedTime = timestamp.toISOString().replace('T', ' ').replace('Z', '');
    
    const sizeInKB = (file.size / 1024).toFixed(2);
    const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
    const sizeStr = file.size > 1048576 ? `${sizeInMB} MB (${file.size} bytes)` : `${sizeInKB} KB (${file.size} bytes)`;

    // Obtener Geolocalización
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const geoStr = `Lat: ${pos.coords.latitude.toFixed(6)}, Lon: ${pos.coords.longitude.toFixed(6)} (±${pos.coords.accuracy.toFixed(1)}m)`;
          generateIntegratedStamp(file, formattedTime, sizeStr, geoStr);
        },
        () => {
          generateIntegratedStamp(file, formattedTime, sizeStr, "GEO: No permitida");
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      generateIntegratedStamp(file, formattedTime, sizeStr, "GEO: No soportada");
    }
  }

  function generateIntegratedStamp(file, timeStr, sizeStr, geoStr) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');

        // Dimensiones base de la imagen
        const imgWidth = img.width;
        const imgHeight = img.height;

        // Franja de datos al pie de la imagen
        const bannerHeight = Math.max(140, Math.round(imgHeight * 0.18));
        const canvasWidth = imgWidth;
        const canvasHeight = imgHeight + bannerHeight;

        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // 1. DIBUJAR LA FOTO ORIGINAL
        ctx.drawImage(img, 0, 0, imgWidth, imgHeight);

        // 2. DIBUJAR BANDA INFERIOR DE METADATOS
        ctx.fillStyle = '#090d16';
        ctx.fillRect(0, imgHeight, canvasWidth, bannerHeight);

        // Línea divisora verde fosforescente
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = Math.max(3, Math.round(imgWidth * 0.005));
        ctx.beginPath();
        ctx.moveTo(0, imgHeight);
        ctx.lineTo(canvasWidth, imgHeight);
        ctx.stroke();

        // Estilos de texto adaptativos según resolución de la foto
        const fontSizeTitle = Math.max(16, Math.round(imgWidth * 0.028));
        const fontSizeData = Math.max(13, Math.round(imgWidth * 0.022));
        const marginX = Math.round(imgWidth * 0.03);

        ctx.fillStyle = '#38bdf8';
        ctx.font = `bold ${fontSizeTitle}px monospace`;
        ctx.fillText('FECHADO DIGITAL - CERTIFICACIÓN DE INTEGRIDAD', marginX, imgHeight + (bannerHeight * 0.25));

        ctx.fillStyle = '#f8fafc';
        ctx.font = `${fontSizeData}px monospace`;
        ctx.fillText(`FECHA/HORA (UTC) : ${timeStr}`, marginX, imgHeight + (bannerHeight * 0.48));
        ctx.fillText(`TAMANO / PESO    : ${sizeStr}`, marginX, imgHeight + (bannerHeight * 0.68));
        ctx.fillText(`UBICACIÓN (GEO)  : ${geoStr}`, marginX, imgHeight + (bannerHeight * 0.88));

        // 3. SELLO CUADRADO "FECHADO DIGITAL" QUE PISA LA ESQUINA SUPERIOR DERECHA DE LA FOTO
        const stampSize = Math.max(120, Math.round(imgWidth * 0.22));
        const stampX = imgWidth - stampSize - Math.round(imgWidth * 0.04);
        const stampY = Math.round(imgHeight * 0.04);

        ctx.save();
        ctx.translate(stampX + (stampSize / 2), stampY + (stampSize / 2));
        ctx.rotate(-12 * Math.PI / 180); // Inclinación de sello físico

        // Fondo semi-transparente para dar efecto de sello de goma pisando la foto
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillRect(-stampSize/2, -stampSize/2, stampSize, stampSize);

        // Borde doble rojo
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = Math.max(3, Math.round(stampSize * 0.03));
        ctx.strokeRect(-stampSize/2, -stampSize/2, stampSize, stampSize);

        // Líneas internas del sello
        const stampFontSizeHeader = Math.max(10, Math.round(stampSize * 0.09));
        const stampFontSizeTime = Math.max(8, Math.round(stampSize * 0.075));

        ctx.fillStyle = '#dc2626';
        ctx.textAlign = 'center';
        ctx.font = `bold ${stampFontSizeHeader}px sans-serif`;
        ctx.fillText('FECHADO DIGITAL', 0, -stampSize * 0.22);

        ctx.beginPath();
        ctx.moveTo(-stampSize * 0.38, -stampSize * 0.12);
        ctx.lineTo(stampSize * 0.38, -stampSize * 0.12);
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = `bold ${stampFontSizeHeader}px sans-serif`;
        ctx.fillText('FE CIERTA', 0, stampSize * 0.08);

        const timeOnly = timeStr.split(' ')[1] || timeStr;
        ctx.font = `${stampFontSizeTime}px monospace`;
        ctx.fillText(timeOnly, 0, stampSize * 0.32);

        ctx.restore();

        // 4. GENERAR IMAGEN FINAL UNIFICADA PARA DESCARGA
        const dataUrl = canvas.toDataURL('image/png');
        
        const finalImg = document.getElementById('finalImage');
        finalImg.src = dataUrl;

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = dataUrl;
        downloadBtn.download = `Fechado_Digital_Integrado_${Date.now()}.png`;

        document.getElementById('resultSection').style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
